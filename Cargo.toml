[package]
name = "hetida-db"
version = "0.1.0"
edition = "2024"
authors = ["Heiko Dietz <hdietz@outlook.com>"]
description = "High-performance time-series archiver built on Apache Arrow Flight, Parquet and DataFusion"
license = "MIT"
readme = "README.md"

[dependencies]
# Startup and CLI errors, where a chain of context beats a typed enum.
# Library and domain logic uses thiserror instead.
anyhow = "1"
arc-swap = "1.9.2"
# Arrow is pinned to the version DataFusion resolves to, not to the latest
# release: arrow, parquet, arrow-flight and datafusion must share one Arrow
# major or their types conflict across crate boundaries. datafusion 54.1
# resolves arrow 58.4, so Phase 3 must add datafusion 54.x, not a newer line.
arrow = "58.4"
# The wire protocol (§5). Same Arrow version as above, by the rule in that
# comment: it exchanges Arrow types across the crate boundary.
arrow-flight = "58.4"
# `ObjectStore` is an async trait, and this is the crate it is declared with.
async-trait = "0.1"
bytes = "1"
# Calendar arithmetic for the Hive-style partition layout (§11). Pinned to the
# version arrow already resolves, so only one chrono is in the graph.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
crc32fast = "1.5.0"
dashmap = "6.2.1"
# The query engine (§5). This is the crate the Arrow version is derived from,
# not the other way round: 54.1 resolves arrow 58.4, which is why every Arrow
# crate above is pinned there. Bumping this line means bumping all of them.
datafusion = "54.1"
# Stream combinators for the do_put/do_get streams; arrow-flight speaks in
# `futures::Stream`, so this is its vocabulary rather than an extra choice.
futures = "0.3"
# DataFusion reads Parquet through this, so the archive's own `Storage` is
# adapted onto it rather than the query path opening files behind its back —
# one store, one truth. Pinned to the line datafusion 54.1 resolves.
object_store = "0.13"
# The archive format. Same Arrow version as above, by the rule in that comment:
# it writes Arrow types straight to disk.
parquet = { version = "58.4", features = ["zstd"] }
# Control-plane message types (§5), generated from proto/hetida.proto. Pinned to
# the line arrow-flight resolves, since Flight's own messages use the same one.
prost = "0.14"
# Entropy for bearer tokens (§9), through the OS. Only `OsRng` is used — a
# seeded generator would make a token guessable from another one.
rand = { version = "0.9", features = ["os_rng"] }
# The archive configuration file (`HETIDA_CONFIG`). Derive only — nothing here
# is on a hot path, and the file is read once at startup.
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# The configuration file's format. Same family as Cargo's own, so an operator
# already knows the syntax.
toml = "0.9"
# Async runtime. Features kept to what the server needs: a multi-threaded
# runtime, the test/main macros, TCP, and signal handling for shutdown.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# gRPC transport under Arrow Flight. Pinned to the line arrow-flight 58.4
# resolves (0.14): a different major would make its Flight service traits
# incompatible with ours.
# `tls-ring` terminates TLS in the server (§9). Ring rather than aws-lc: it
# builds without cmake or a C toolchain, which keeps the archive buildable
# wherever cargo is.
tonic = { version = "0.14", features = ["transport", "router", "server", "channel", "codegen", "tls-ring"] }
# Payload digests for §1 unchanged-value suppression. Non-cryptographic is
# sufficient: the comparison is not adversarial — a client constructing a
# collision would only discard its own correction, which it could equally
# achieve by not sending it.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
# Phase 4 micro-benchmarks. Statistical, so it belongs on components a benchmark
# can hold still — not on anything that crosses the network, where jitter
# invalidates its estimates. That measurement has its own harness.
criterion = "0.7"
proptest = "1"
# A self-signed certificate for the TLS test (§9). Generated in the test rather
# than checked in: a committed key is a key, however clearly it is labelled a
# test one, and one that expires turns a passing suite into a failing one.
rcgen = "0.14"
# The load harness writes into a temporary archive when none is configured.
tempfile = "3"
# test-util gives paused time, so a timer-driven test is deterministic rather
# than sleeping (CLAUDE.md: no sleep, no wall-clock assertions).
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tokio-stream = "0.1"

[build-dependencies]
# protox compiles the .proto in pure Rust, so cargo build needs no protoc
# installed system-wide — prost-build's default path shells out to it.
prost-build = "0.14"
protox = "0.9"

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "query"
harness = false
